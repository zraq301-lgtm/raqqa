name: "Roqa Admin Production Build"

on:
  push:
    branches:
      - main
    paths:
      - 'admin/**' # يعمل الأكشن فقط عند تعديل مجلد الأدمن
  workflow_dispatch:
    inputs:
      build_android:
        description: 'Build Android APK/AAB packages'
        required: false
        type: boolean
        default: false
      build_aab:
        description: 'Also build and publish an AAB'
        required: false
        type: boolean
        default: false
      allow_new_admin_signing_key:
        description: 'Allow a fresh-install admin APK signed with the public-app production key'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      HAS_FIREBASE_ADMIN: ${{ secrets.FIREBASE_ADMIN_JSON_BASE64 != '' }}
      HAS_ADMIN_SIGNING: ${{ (secrets.ADMIN_KEYSTORE_BASE64 != '' && secrets.ADMIN_KEYSTORE_PASSWORD != '' && secrets.ADMIN_KEY_ALIAS != '' && secrets.ADMIN_KEY_PASSWORD != '') || (secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '') }}
      BUILD_ADMIN_ANDROID: ${{ github.event_name == 'push' || inputs.build_android == true }}
      BUILD_ADMIN_AAB: ${{ github.event_name == 'push' || inputs.build_aab == true }}
      ALLOW_NEW_ADMIN_SIGNING_KEY: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_new_admin_signing_key == true }}
      VITE_RAQQA_API_BASE_URL: https://raqqa-backend.raqqa-api.workers.dev

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup Java 17
        if: env.BUILD_ADMIN_ANDROID == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 4. Install Shared & Admin Dependencies
        run: |
          npm ci --legacy-peer-deps
          cd admin
          rm -rf node_modules package-lock.json android ios dist_web
          npm config set fetch-retries 5
          npm config set fetch-retry-factor 2
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          for attempt in 1 2 3; do
            npm install --legacy-peer-deps && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "npm install failed; retrying in 15 seconds (attempt $((attempt + 1))/3)"
            sleep 15
          done
          for attempt in 1 2 3; do
            npm install onesignal-cordova-plugin @capacitor/push-notifications @capacitor/local-notifications --save --legacy-peer-deps && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "Capacitor plugin install failed; retrying in 15 seconds (attempt $((attempt + 1))/3)"
            sleep 15
          done
          npm run build

      - name: 5. Initialize Android (Fresh Start for Admin)
        if: env.BUILD_ADMIN_ANDROID == 'true'
        run: |
          cd admin
          npx cap add android
          npx cap sync android

      - name: 6. Inject Firebase & App Identity (Admin Config)
        if: env.BUILD_ADMIN_ANDROID == 'true' && env.HAS_FIREBASE_ADMIN == 'true'
        env:
          FIREBASE_ADMIN_JSON_BASE64: ${{ secrets.FIREBASE_ADMIN_JSON_BASE64 }}
        run: |
          TMP=$(mktemp)
          if printf '%s' "$FIREBASE_ADMIN_JSON_BASE64" | base64 --decode > "$TMP" 2>/dev/null && grep -qE '^\s*\{' "$TMP"; then
            mv "$TMP" admin/android/app/google-services.json
          else
            rm -f "$TMP"
            printf '%s' "$FIREBASE_ADMIN_JSON_BASE64" | sed '/^[[:space:]]*```/d' > admin/android/app/google-services.json
          fi
          python3 -m json.tool admin/android/app/google-services.json >/dev/null || {
            echo "::error::FIREBASE_ADMIN_JSON_BASE64 ليس google-services.json صالحًا. ضع محتوى الملف نفسه أو Base64 صحيحًا بدون Markdown fences.";
            exit 1;
          }

      - name: 7. Generate Admin Icons
        if: env.BUILD_ADMIN_ANDROID == 'true'
        run: |
          cd admin
          mkdir -p assets
          # جلب الأيقونات من المجلد الرئيسي أو مجلد الأدمن
          find .. -name "icon-only.png" -exec cp {} assets/icon-only.png \;
          find .. -name "icon-background.png" -exec cp {} assets/icon-background.png \;
          find .. -name "icon-foreground.png" -exec cp {} assets/icon-foreground.png \;
          npx capacitor-assets generate --android

      - name: 8. Build Admin Android Binaries
        if: env.BUILD_ADMIN_ANDROID == 'true'
        run: |
          cd admin/android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleRelease
          if [ "$BUILD_ADMIN_AAB" = 'true' ]; then
            ./gradlew bundleRelease
          fi

      - name: 9. Sign Admin APK & AAB
        id: sign_admin
        if: env.BUILD_ADMIN_ANDROID == 'true' && env.HAS_ADMIN_SIGNING == 'true'
        env:
          ADMIN_KEYSTORE_BASE64: ${{ secrets.ADMIN_KEYSTORE_BASE64 }}
          ADMIN_KEYSTORE_PASSWORD: ${{ secrets.ADMIN_KEYSTORE_PASSWORD }}
          ADMIN_KEY_ALIAS: ${{ secrets.ADMIN_KEY_ALIAS }}
          ADMIN_KEY_PASSWORD: ${{ secrets.ADMIN_KEY_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KS_PATH="/dev/shm/raqqa-admin-signing-${GITHUB_RUN_ID}.jks"
          REF_APK="${RUNNER_TEMP}/raqqa-admin-reference.apk"
          trap 'rm -f "$KS_PATH" "$REF_APK"' EXIT

          STORE_PASSWORD=""
          KEY_ALIAS=""
          KEY_PASSWORD=""
          SIGNING_KEY_SOURCE=""
          if [ "$ALLOW_NEW_ADMIN_SIGNING_KEY" = 'true' ] && [ -n "$ANDROID_KEYSTORE_BASE64" ] && printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KS_PATH" 2>/dev/null && keytool -list -keystore "$KS_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
            STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
            KEY_ALIAS="$ANDROID_KEY_ALIAS"
            KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
            SIGNING_KEY_SOURCE="public-app-production"
            echo "Using the existing public-app production key for the explicitly approved fresh-install admin APK."
          elif [ -n "$ADMIN_KEYSTORE_BASE64" ] && printf '%s' "$ADMIN_KEYSTORE_BASE64" | base64 --decode > "$KS_PATH" 2>/dev/null && keytool -list -keystore "$KS_PATH" -storepass "$ADMIN_KEYSTORE_PASSWORD" -alias "$ADMIN_KEY_ALIAS" >/dev/null 2>&1; then
            STORE_PASSWORD="$ADMIN_KEYSTORE_PASSWORD"
            KEY_ALIAS="$ADMIN_KEY_ALIAS"
            KEY_PASSWORD="$ADMIN_KEY_PASSWORD"
            SIGNING_KEY_SOURCE="admin"
            echo "Using the configured admin signing key."
          elif [ -n "$ANDROID_KEYSTORE_BASE64" ] && printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KS_PATH" 2>/dev/null && keytool -list -keystore "$KS_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
            STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
            KEY_ALIAS="$ANDROID_KEY_ALIAS"
            KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
            SIGNING_KEY_SOURCE="public-app-production"
            echo "Admin key unavailable; checking the existing production signing key against the previous admin APK."
          else
            echo "::error::No valid configured admin or production signing key is available."
            exit 1
          fi

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -x "$APKSIGNER"
          curl --fail --silent --show-error --location \
            "https://github.com/zraq301-lgtm/raqqa/releases/download/admin-only-v37/Roqa-EXCLUSIVE-ADMIN.apk" \
            --output "$REF_APK"
          KEY_FINGERPRINT=$(keytool -list -v -keystore "$KS_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | awk '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          ADMIN_FINGERPRINT=$("$APKSIGNER" verify --print-certs "$REF_APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          if [ -z "$KEY_FINGERPRINT" ] || [ -z "$ADMIN_FINGERPRINT" ] || [ "$KEY_FINGERPRINT" != "$ADMIN_FINGERPRINT" ]; then
            if [ "$ALLOW_NEW_ADMIN_SIGNING_KEY" = 'true' ] && [ "$SIGNING_KEY_SOURCE" = 'public-app-production' ]; then
              echo "::warning::The APK is signed with the public-app production key and will be a fresh install, not an update to the prior admin app."
            else
              echo "::error::Signing certificate does not match the previous admin APK; refusing to publish an incompatible update."
              exit 1
            fi
          fi

          APK_PATH=$(find admin/android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          "$APKSIGNER" sign --ks "$KS_PATH" \
            --ks-key-alias "$KEY_ALIAS" --ks-pass pass:"$STORE_PASSWORD" \
            --key-pass pass:"$KEY_PASSWORD" --out Roqa-EXCLUSIVE-ADMIN.apk "$APK_PATH"
          "$APKSIGNER" verify --verbose Roqa-EXCLUSIVE-ADMIN.apk

          if [ "$BUILD_ADMIN_AAB" = 'true' ]; then
            AAB_PATH=$(find admin/android/app/build/outputs/bundle/release/ -name "*.aab" | head -n 1)
            jarsigner -keystore "$KS_PATH" -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" "$AAB_PATH" "$KEY_ALIAS"
            jarsigner -verify "$AAB_PATH"
            cp "$AAB_PATH" Roqa-EXCLUSIVE-ADMIN.aab
          fi

      - name: 10. Publish Admin OTA to GitHub Releases
        run: |
          set -euo pipefail
          VERSION="ota-${GITHUB_SHA::12}"
          (cd admin/dist_web && zip -qr "../../raqqa-admin-ota.zip" .)
          CHECKSUM=$(sha256sum raqqa-admin-ota.zip | awk '{print $1}')
          cat > raqqa-admin-ota-manifest.json <<EOF
          {
            "bundleId": "$VERSION",
            "nativeCompatibility": "1",
            "artifactType": "zip",
            "url": "https://github.com/zraq301-lgtm/raqqa/releases/download/ota-admin/raqqa-admin-ota.zip",
            "checksum": "$CHECKSUM"
          }
          EOF

      - name: Publish Admin OTA Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ota-admin
          name: Raqqa Admin OTA Web Bundle
          prerelease: false
          make_latest: false
          overwrite_files: true
          files: |
            raqqa-admin-ota.zip
            raqqa-admin-ota-manifest.json
          body: |
            Automatically published Admin web-only OTA bundle from commit ${{ github.sha }}.
            Native compatibility: 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- رفع الملفات الموقعة فقط كملفات قابلة للتثبيت ---
      - name: 11. Upload Signed Admin APK
        if: env.BUILD_ADMIN_ANDROID == 'true' && steps.sign_admin.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Roqa-Admin-APK
          path: Roqa-EXCLUSIVE-ADMIN.apk

      - name: 11b. Upload Signed Admin AAB
        if: env.BUILD_ADMIN_ANDROID == 'true' && env.BUILD_ADMIN_AAB == 'true' && steps.sign_admin.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Roqa-Admin-AAB
          path: Roqa-EXCLUSIVE-ADMIN.aab

      # --- نشر صفحة إصدار منفصلة للأدمن ضمن صفحة Releases نفسها ---
      - name: 12. Publish Admin Release with AAB
        if: env.BUILD_ADMIN_ANDROID == 'true' && env.BUILD_ADMIN_AAB == 'true' && steps.sign_admin.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: admin-only-v${{ github.run_number }}
          name: "Roqa EXCLUSIVE ADMIN PANEL Build v${{ github.run_number }}"
          files: |
            Roqa-EXCLUSIVE-ADMIN.apk
            Roqa-EXCLUSIVE-ADMIN.aab
          body: |
            Admin-only Android release. This package is separate from the public app.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 12b. Publish Admin APK-only Release
        if: env.BUILD_ADMIN_ANDROID == 'true' && env.BUILD_ADMIN_AAB != 'true' && steps.sign_admin.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: admin-only-v${{ github.run_number }}
          name: "Roqa EXCLUSIVE ADMIN PANEL Build v${{ github.run_number }}"
          files: Roqa-EXCLUSIVE-ADMIN.apk
          body: |
            Admin-only APK release. Signed with the public-app production key as explicitly approved.
            This is a fresh-install package, not an update to admin APKs signed with the previous admin certificate.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
