name: "Roqa Admin Production Build"

on:
  push:
    branches:
      - main
    paths:
      - 'admin/**' # يعمل الأكشن فقط عند تعديل مجلد الأدمن
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      HAS_FIREBASE_ADMIN: ${{ secrets.FIREBASE_ADMIN_JSON_BASE64 != '' }}
      HAS_ADMIN_SIGNING: ${{ secrets.ADMIN_KEYSTORE_BASE64 != '' && secrets.ADMIN_KEYSTORE_PASSWORD != '' && secrets.ADMIN_KEY_ALIAS != '' && secrets.ADMIN_KEY_PASSWORD != '' }}

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 4. Deep Clean & Install (Admin Folder)
        run: |
          cd admin
          rm -rf node_modules package-lock.json android ios dist_web
          npm install --legacy-peer-deps
          npm install onesignal-cordova-plugin @capacitor/push-notifications @capacitor/local-notifications --save --legacy-peer-deps
          npm run build

      - name: 5. Initialize Android (Fresh Start for Admin)
        run: |
          cd admin
          npx cap add android
          npx cap sync android

      - name: 6. Inject Firebase & App Identity (Admin Config)
        if: env.HAS_FIREBASE_ADMIN == 'true'
        env:
          FIREBASE_ADMIN_JSON_BASE64: ${{ secrets.FIREBASE_ADMIN_JSON_BASE64 }}
        run: |
          TMP=$(mktemp)
          if printf '%s' "$FIREBASE_ADMIN_JSON_BASE64" | base64 --decode > "$TMP" 2>/dev/null && grep -qE '^\s*\{' "$TMP"; then
            mv "$TMP" admin/android/app/google-services.json
          else
            rm -f "$TMP"
            printf '%s' "$FIREBASE_ADMIN_JSON_BASE64" | sed '/^[[:space:]]*```/d' > admin/android/app/google-services.json
          fi
          python3 -m json.tool admin/android/app/google-services.json >/dev/null || {
            echo "::error::FIREBASE_ADMIN_JSON_BASE64 ليس google-services.json صالحًا. ضع محتوى الملف نفسه أو Base64 صحيحًا بدون Markdown fences.";
            exit 1;
          }

      - name: 7. Generate Admin Icons
        run: |
          cd admin
          mkdir -p assets
          # جلب الأيقونات من المجلد الرئيسي أو مجلد الأدمن
          find .. -name "icon-only.png" -exec cp {} assets/icon-only.png \;
          find .. -name "icon-background.png" -exec cp {} assets/icon-background.png \;
          find .. -name "icon-foreground.png" -exec cp {} assets/icon-foreground.png \;
          npx capacitor-assets generate --android

      - name: 8. Build Admin Android Binaries
        run: |
          cd admin/android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleRelease
          ./gradlew bundleRelease

      - name: 9. Sign Admin APK & AAB
        if: env.HAS_ADMIN_SIGNING == 'true'
        run: |
          # توليد مفتاح توقيع
          echo "${{ secrets.ADMIN_KEYSTORE_BASE64 }}" | base64 --decode > admin_release.jks
          keytool -list -keystore admin_release.jks -storepass "${{ secrets.ADMIN_KEYSTORE_PASSWORD }}" >/dev/null
          
          # توقيع الـ APK وتسميته باسم حصري للأدمن تمامًا لحل تداخل الإنتاج
          APK_PATH=$(find admin/android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          /usr/local/lib/android/sdk/build-tools/34.0.0/apksigner sign --ks admin_release.jks \
            --ks-key-alias "${{ secrets.ADMIN_KEY_ALIAS }}" --ks-pass pass:"${{ secrets.ADMIN_KEYSTORE_PASSWORD }}" \
            --key-pass pass:"${{ secrets.ADMIN_KEY_PASSWORD }}" --out Roqa-EXCLUSIVE-ADMIN.apk "$APK_PATH"
          
          # توقيع الـ AAB وتسميته باسم حصري
          AAB_PATH=$(find admin/android/app/build/outputs/bundle/release/ -name "*.aab" | head -n 1)
          jarsigner -keystore admin_release.jks -storepass "${{ secrets.ADMIN_KEYSTORE_PASSWORD }}" -keypass "${{ secrets.ADMIN_KEY_PASSWORD }}" "$AAB_PATH" "${{ secrets.ADMIN_KEY_ALIAS }}"
          cp "$AAB_PATH" Roqa-EXCLUSIVE-ADMIN.aab

      # --- الرفع المباشر كملف مستقل (Artifact) للأدمن ---
      - name: 10. Upload Admin Artifacts (Direct Download)
        uses: actions/upload-artifact@v4
        with:
          name: Roqa-Admin-Only-Package
          path: |
            admin/android/app/build/outputs/apk/release/*.apk
            admin/android/app/build/outputs/bundle/release/*.aab

      # --- نشر صفحة ريليس حصرية للأدمن بعيداً عن ريليس الواجهة الحالي ---
      - name: 11. Publish Admin Release
        if: env.HAS_ADMIN_SIGNING == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: admin-only-v${{ github.run_number }}
          name: "Roqa EXCLUSIVE ADMIN PANEL Build v${{ github.run_number }}"
          files: |
            Roqa-EXCLUSIVE-ADMIN.apk
            Roqa-EXCLUSIVE-ADMIN.aab
            admin_release.jks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
