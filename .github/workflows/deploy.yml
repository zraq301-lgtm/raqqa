name: Cloudflare Pages OTA - Raqqa

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'capacitor.config.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-ota:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: 36c22f2763684e47f753785acf50f1cf
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Web Bundle
        run: npm run build

      - name: Package OTA files for Cloudflare Pages
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN GitHub secret'; exit 1; }
          mkdir -p pages_deploy/ota
          cp -a dist_web/. pages_deploy/
          (cd dist_web && zip -qr ../pages_deploy/ota/raqqa-ota.zip .)
          CHECKSUM=$(sha256sum pages_deploy/ota/raqqa-ota.zip | awk '{print $1}')
          cat > pages_deploy/ota/raqqa-ota-manifest.json <<EOF
          {
            "bundleId": "ota-${GITHUB_SHA::12}",
            "nativeCompatibility": "1",
            "artifactType": "zip",
            "url": "https://raqqa-ota.pages.dev/ota/raqqa-ota.zip",
            "checksum": "$CHECKSUM"
          }
          EOF

      - name: Deploy OTA to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy pages_deploy --project-name=raqqa-ota --branch=main --commit-hash="$GITHUB_SHA" --commit-message="$GITHUB_SHA"
