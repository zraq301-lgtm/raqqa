name: GitHub OTA Web Bundle - Raqqa

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'capacitor.config.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-ota:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Web Bundle
        run: npm run build

      - name: Package and checksum OTA bundle
        shell: bash
        run: |
          set -euo pipefail
          VERSION="ota-${GITHUB_SHA::12}"
          ZIP="raqqa-ota.zip"
          (cd dist_web && zip -qr "../$ZIP" .)
          CHECKSUM=$(sha256sum "$ZIP" | awk '{print $1}')
          cat > raqqa-ota-manifest.json <<EOF
          {
            "bundleId": "$VERSION",
            "nativeCompatibility": "1",
            "artifactType": "zip",
            "url": "https://github.com/zraq301-lgtm/raqqa/releases/download/ota-main/raqqa-ota.zip",
            "checksum": "$CHECKSUM"
          }
          EOF

      - name: Publish OTA bundle to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ota-main
          name: Raqqa OTA Web Bundle
          prerelease: false
          make_latest: false
          overwrite_files: true
          files: |
            raqqa-ota.zip
            raqqa-ota-manifest.json
          body: |
            Automatically published web-only OTA bundle from commit ${{ github.sha }}.
            Native compatibility: 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
