name: Cloudflare Pages OTA - Raqqa

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'gateway/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-ota:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: 36c22f2763684e47f753785acf50f1cf
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Web Bundle
        run: npm run build

      - name: Build and update AI gateway code only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN GitHub secret'; exit 1; }
          npm ci --prefix gateway
          ./gateway/node_modules/.bin/esbuild gateway/src/index.ts --bundle --format=esm --target=es2022 --minify --legal-comments=none --outfile=gateway/dist/worker.js
          upload_status=$(curl --silent --show-error -o /tmp/worker-upload.json -w '%{http_code}' \
            -X PUT "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/ai-chat-gateway/content" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -F 'metadata={"main_module":"worker.js"};type=application/json' \
            -F 'worker.js=@gateway/dist/worker.js;type=application/javascript+module')
          if [ "$upload_status" != '200' ]; then
            echo "Cloudflare Worker content upload returned HTTP $upload_status"
            cat /tmp/worker-upload.json
            exit 1
          fi
          if ! jq -e '.success == true' /tmp/worker-upload.json >/dev/null; then
            echo 'Cloudflare Worker content upload returned an unsuccessful API envelope:'
            cat /tmp/worker-upload.json
            exit 1
          fi
          curl --retry 5 --retry-delay 2 --fail --silent --show-error https://ai-chat-gateway.raqqa-api.workers.dev/health | jq -e '.status == "ok"' >/dev/null
          status=$(curl --silent --show-error -o /tmp/transcribe-invalid.json -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            --data '{"url":"file:///etc/passwd"}' \
            https://ai-chat-gateway.raqqa-api.workers.dev/api/ai/transcribe)
          test "$status" = '400'
          jq -e '.error' /tmp/transcribe-invalid.json >/dev/null

      - name: Package OTA bundle and manifest
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN GitHub secret'; exit 1; }
          mkdir -p pages_deploy/ota ota_artifacts
          cp -a dist_web/. pages_deploy/
          (cd dist_web && zip -qr ../ota_artifacts/raqqa-ota.zip .)
          CHECKSUM=$(sha256sum ota_artifacts/raqqa-ota.zip | awk '{print $1}')
          cat > pages_deploy/ota/raqqa-ota-manifest.json <<EOF
          {
            "bundleId": "ota-${GITHUB_SHA::12}",
            "nativeCompatibility": "1",
            "artifactType": "zip",
            "url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/ota-main/raqqa-ota.zip",
            "checksum": "$CHECKSUM"
          }
          EOF

      - name: Publish OTA bundle to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view ota-main --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload ota-main ota_artifacts/raqqa-ota.zip pages_deploy/ota/raqqa-ota-manifest.json --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create ota-main ota_artifacts/raqqa-ota.zip pages_deploy/ota/raqqa-ota-manifest.json --target "$GITHUB_SHA" --title "Raqqa App OTA" --notes "Latest web bundle for Raqqa's mobile application." --repo "$GITHUB_REPOSITORY"
          fi

      - name: Deploy OTA to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy pages_deploy --project-name=raqqa-ota --branch=main --commit-hash="$GITHUB_SHA" --commit-message="$GITHUB_SHA"
