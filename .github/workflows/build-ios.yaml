name: Raqqa iOS Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'ios/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'

jobs:
  ios:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install and build React UI
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Restore Firebase iOS configuration
        if: ${{ secrets.FIREBASE_IOS_PLIST_BASE64 != '' }}
        env:
          FIREBASE_IOS_PLIST_BASE64: ${{ secrets.FIREBASE_IOS_PLIST_BASE64 }}
        run: echo "$FIREBASE_IOS_PLIST_BASE64" | base64 --decode > ios/App/App/GoogleService-Info.plist

      - name: Install CocoaPods and sync Capacitor
        run: |
          sudo gem install cocoapods
          npx cap sync ios
          cd ios/App
          pod install --repo-update

      - name: Build unsigned iOS simulator app
        working-directory: ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
