// المسار في الباك إند: api/sync-wordpress.js

export default async function handler(req, res) {
  // التحقق من مفتاح الأمان القادم من جيت هاب أكشن
  const authHeader = req.headers['zazotona'];
  if (authHeader !== '12sonds25') {
    return res.status(401).json({ error: 'غير مصرح لك بالدخول 🔒' });
  }

  try {
    // 1️⃣ جلب البيانات الجديدة من محرك الرفع الخاص بكِ بدلاً من ووردبريس
    const targetUploadUrl = "https://nawah-ai-db.vercel.app/api/engine";
    const response = await fetch(targetUploadUrl);
    
    if (!response.ok) throw new Error("فشل الاتصال بمحرك الرفع الجديد");
    const freshData = await response.json();

    // 2️⃣ [هنا كودكِ الحالي الذي يأخذ البيانات ويحدث ملفات الـ JSON في جيت هاب]
    // const updateSuccess = await saveToGitHub(freshData); 
    const updateSuccess = true; // نعتبره نجح

    if (updateSuccess) {
      
      // 3️⃣ إرسال الإشعار فوراً لجميع الأجهزة بعد التحديث الناجح
      await sendPushNotification(
        "🌸 تحديث واحة رقة", 
        "تمت إضافة مجالات وفيديوهات استرخاء جديدة للتطبيق! افتحيه الآن ✨"
      );

      return res.status(200).json({ 
        success: true, 
        message: "تم مزامنة البيانات من المحرك الجديد وإرسال الإشعار بنجاح! 🚀" 
      });
    }

  } catch (error) {
    console.error("Sync Error:", error);
    return res.status(500).json({ success: false, error: error.message });
  }
}

// دالة إرسال الإشعارات لجميع الأجهزة (OneSignal كمثال وهي الأكثر توافقاً مع نظامكِ السابق)
async function sendPushNotification(title, body) {
  const ONESIGNAL_APP_ID = "YOUR_ONESIGNAL_APP_ID"; 
  const ONESIGNAL_REST_API_KEY = "YOUR_ONESIGNAL_REST_API_KEY"; 

  await fetch("https://onesignal.com/api/v1/notifications", {
    method: "POST",
    headers: {
      "Content-Type": "application/json; charset=utf-8",
      "Authorization": `Basic ${ONESIGNAL_REST_API_KEY}`
    },
    body: JSON.stringify({
      app_id: ONESIGNAL_APP_ID,
      included_segments: ["All Subscribers"], 
      headings: { ar: title },
      contents: { ar: body }
    })
  });
}
