name: "Raqqa Notifications Sync via API"

on:
  schedule:
    # التنفيذ كل 12 ساعة
    - cron: "0 6,18 * * *" 
  workflow_dispatch: # للتشغيل اليدوي للتجربة

jobs:
  check_api_and_notify:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Current Repo (To save hash state)"
        uses: actions/checkout@v4

      - name: "Fetch API Data and Compare Hash"
        id: compare_hash
        run: |
          # 1. جلب البيانات الحالية من رابط محرك الرفع وحساب بصمتها الإلكترونية
          FRESH_DATA=$(curl -s "https://nawah-ai-db.vercel.app/api/engine")
          NEW_HASH=$(echo "$FRESH_DATA" | md5sum | awk '{print $1}')
          
          echo "البصمة الجديدة للمحتوى: $NEW_HASH"
          
          # 2. قراءة البصمة القديمة إذا كانت محفوظة من قبل
          OLD_HASH=""
          if [ -f ".github/last_content_hash.txt" ]; then
            OLD_HASH=$(cat .github/last_content_hash.txt)
          fi
          echo "البصمة القديمة المخزنة: $OLD_HASH"
          
          # 3. المقارنة الشرطية
          if [ "$NEW_HASH" != "$OLD_HASH" ]; then
            echo "updated=true" >> $GITHUB_OUTPUT
            # حفظ البصمة الجديدة للمرة القادمة
            mkdir -p .github
            echo "$NEW_HASH" > .github/last_content_hash.txt
            echo "🚀 تم رصد تغيير أو إضافة محتوى جديد عبر الـ API!"
          else
            echo "updated=false" >> $GITHUB_OUTPUT
            echo "💤 المحتوى متطابق تماماً، لا توجد إضافات جديدة."
          fi

      - name: "Commit New Hash State"
        if: steps.compare_hash.outputs.updated == 'true'
        run: |
          # تحديث ملف البصمة في المستودع الحالي لكي يتذكرها الأكشن في الـ 12 ساعة القادمة
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/last_content_hash.txt
          git commit -m "Chore: Update last content hash [skip ci]" || echo "No changes to commit"
          git push

      - name: "Trigger Firebase Notification"
        if: steps.compare_hash.outputs.updated == 'true'
        run: |
          echo "جاري إرسال الإشعار التلقائي تجاه فيربيس..."
          
          curl -X POST "https://raqqa-hjl8.vercel.app/api/send-fcm" \
            -H "Content-Type: application/json" \
            -d '{
              "title": "🌸 تحديث واحة رقة",
              "body": "تمت إضافة مقاطع ومجالات استرخاء جديدة مخصصة لكِ في أقسام التطبيق! افتحيه الآن ✨",
              "topic": "all_users"
            }'
