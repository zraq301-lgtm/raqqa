name: "Raqqa Notifications Sync"

on:
  schedule:
    # التنفيذ كل 12 ساعة (الساعة 6 صباحاً و6 مساءً)
    - cron: "0 6,18 * * *" 
  workflow_dispatch: # يتيح لكِ تشغيل الأكشن يدوياً من لوحة GitHub Actions لغرض الفحص

jobs:
  check_and_notify:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # نحتاج لجلب آخر تغييرين لمقارنة ما تم تعديله في المستودع

      - name: "Check if raqqa_sections has new updates"
        id: check_changes
        run: |
          # فحص هل حدث أي تعديل أو إضافة ملفات داخل مجلد raqqa_sections في آخر تحديث
          # أمر git diff يتحقق إذا كان المجلد العام قد طرأ عليه تغيير
          if git diff --name-only HEAD~1 HEAD | grep -q "^raqqa_sections/"; then
            echo "updated=true" >> $GITHUB_OUTPUT
            echo "🚀 تم رصد إضافة أو تعديل محتوى جديد داخل مجلد raqqa_sections العام!"
          else
            echo "updated=false" >> $GITHUB_OUTPUT
            echo "💤 مجلد raqqa_sections مستقر ولا توجد أي إضافات جديدة."
          fi

      - name: "Trigger Firebase Notification if Updated"
        if: steps.check_changes.outputs.updated == 'true'
        run: |
          echo "جاري إرسال الإشعار التلقائي تجاه فيربيس..."
          
          curl -X POST "https://raqqa-hjl8.vercel.app/send-fcm" \
            -H "Content-Type: application/json" \
            -d '{
              "title": "🌸 تحديث واحة رقة",
              "body": "تمت إضافة مقاطع ومجالات استرخاء جديدة مخصصة لكِ في أقسام التطبيق! افتحيه الآن ✨",
              "topic": "all_users"
            }'
