name: Raqqa Android Production Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_FIREBASE_ANDROID: ${{ secrets.FIREBASE_ANDROID_JSON_BASE64 != '' }}
      HAS_ANDROID_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install and build React UI
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Restore Firebase Android configuration
        if: env.HAS_FIREBASE_ANDROID == 'true'
        env:
          FIREBASE_ANDROID_JSON_BASE64: ${{ secrets.FIREBASE_ANDROID_JSON_BASE64 }}
        run: |
          TMP=$(mktemp)
          if printf '%s' "$FIREBASE_ANDROID_JSON_BASE64" | base64 --decode > "$TMP" 2>/dev/null && grep -qE '^\s*\{' "$TMP"; then
            mv "$TMP" android/app/google-services.json
          else
            rm -f "$TMP"
            printf '%s' "$FIREBASE_ANDROID_JSON_BASE64" | sed '/^[[:space:]]*```/d' > android/app/google-services.json
          fi
          python3 -m json.tool android/app/google-services.json >/dev/null || {
            echo "::error::FIREBASE_ANDROID_JSON_BASE64 ليس google-services.json صالحًا. ضع محتوى الملف نفسه أو Base64 صحيحًا بدون Markdown fences.";
            exit 1;
          }

      - name: Sync Capacitor native projects
        run: npx cap sync android

      - name: Generate Android assets
        run: npx capacitor-assets generate --android

      - name: Build APK and AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease bundleRelease --no-daemon

      - name: Restore Android signing key
        if: env.HAS_ANDROID_SIGNING == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > raqqa-release.jks

      - name: Sign Android artifacts
        if: env.HAS_ANDROID_SIGNING == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          AAB=$(find android/app/build/outputs/bundle/release -name '*.aab' | head -n 1)
          jarsigner -keystore raqqa-release.jks -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" "$AAB" "$KEY_ALIAS"
          APKSIGNER="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}/build-tools/34.0.0/apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            APKSIGNER=$(find "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          fi
          test -x "$APKSIGNER"
          "$APKSIGNER" sign --ks raqqa-release.jks --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD "$APK"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: raqqa-android-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab

      - name: Publish release when signing is configured
        if: env.HAS_ANDROID_SIGNING == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: Raqqa Android ${{ github.run_number }}
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
